<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRM Slides — Chapters 1–5</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="style.css" />
  <!-- pdf.js -->
  <script src="https://unpkg.com/pdfjs-dist@4.5.136/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://unpkg.com/pdfjs-dist@4.5.136/build/pdf.worker.min.js";
  </script>
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <span class="pill">HRM</span>
        <h1>Employee Testing & Selection — Chapters 1–5</h1>
      </div>

      <!-- Top controls -->
      <nav aria-label="Sections" id="chapNav"></nav>

      <div class="bar-tools">
        <input id="q" type="search" placeholder="Search words, phrases, sentences, or questions…  (Ctrl/Cmd+K)" />
        <label class="chk"><input id="exact" type="checkbox" /> Exact phrase</label>
        <label class="chk"><input id="case" type="checkbox" /> Case sensitive</label>
        <button id="exportBtn" class="btn-mini" type="button" title="Download embedded data file">Export data</button>
        <span id="count" class="muted small">0 matches</span>
      </div>
    </div>
  </header>

  <main class="container" id="deck">
    <!-- Slides are generated here -->
  </main>

  <footer class="footer container">
    <p>© <span id="year"></span> HRM Slides — verbatim from PDFs. No generated content.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
